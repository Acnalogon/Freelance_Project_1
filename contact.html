<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt - Psychologische Praxis Wien</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Navbar -->
    <div id="custom-navbar"></div>

    <div data-barba="wrapper">
      <div data-barba="container">
        <section class="container my-5">
          <h1>Kontakt</h1>
          <form id="contact-form">
            <!-- Name and Email Fields -->
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">E-Mail</label>
              <input type="email" class="form-control" id="email" required />
            </div>

            <!-- Booking Appointment Section -->
            <h2>Termin Buchen</h2>
            <div class="mb-3">
              <label for="date" class="form-label">Wunschtermin</label>
              <input type="date" class="form-control" id="date" required />
            </div>
            <div class="mb-3">
              <label for="time" class="form-label">Uhrzeit</label>
              <input type="time" class="form-control" id="time" required />
            </div>

            <!-- Message Section -->
            <div class="mb-3">
              <label for="message" class="form-label">Nachricht</label>
              <textarea
                class="form-control"
                id="message"
                rows="4"
                required
              ></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Senden</button>
          </form>
        </section>

        <footer class="bg-light text-center py-4">
          <p>&copy; 2024 Psychologische Praxis Wien</p>
          <p>
            <a
              href="mailto:info@praxis-wien.at"
              class="text-dark text-decoration-none"
            >
              info@praxis-wien.at
            </a>
            |
            <a href="tel:+431234567890" class="text-dark text-decoration-none">
              +43 123 456 7890
            </a>
          </p>
          <p>Öffnungszeiten:</p>
          <p>Mo - Fr: 9:00 - 17:00 Uhr</p>
          <p>Sa: 10:00 - 14:00 Uhr</p>
        </footer>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- GSAP (for animations) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>

    <!-- Barba.js (for page transitions) -->
    <script src="https://unpkg.com/@barba/core"></script>

    <!-- Your main JavaScript file -->
    <script src="js/main.js"></script>
  </body>
</html>
